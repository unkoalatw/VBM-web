<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0716">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon180.png">
<title>Visual Block Map</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0d0716;touch-action:none}
#c{position:fixed;inset:0;width:100vw;height:100dvh;display:block;outline:none}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;font:600 15px system-ui,"Noto Sans TC",sans-serif;
 background:radial-gradient(ellipse at 50% 120%,#3a1257 0%,#0d0716 60%);transition:opacity .4s}
#load.done{opacity:0;pointer-events:none}
.logo{font:900 clamp(44px,12vw,84px)/1 system-ui,sans-serif;letter-spacing:.06em;color:#f6f1e7;text-shadow:-3px 0 #2fd4ff,3px 0 #ff3d8b}
/* 3x3 方塊依序落下、堆疊、再清空 */
.grid{display:grid;grid-template-columns:repeat(3,22px);gap:5px}
.grid i{width:22px;height:22px;border-radius:5px;opacity:0;animation:drop 2.4s cubic-bezier(.3,1.5,.6,1) infinite}
.grid i:nth-child(3n+1){background:#ff3d8b}.grid i:nth-child(3n+2){background:#2fd4ff}.grid i:nth-child(3n){background:#ffd23f}
@keyframes drop{0%{transform:translateY(-40px) scale(.6);opacity:0}12%{transform:none;opacity:1}75%{transform:none;opacity:1}90%,100%{transform:scale(.2);opacity:0}}
#bar{width:min(64vw,320px);height:8px;background:#ffffff1a;border-radius:4px;overflow:hidden}
#fill{width:0;height:100%;background:linear-gradient(90deg,#ff3d8b,#ffd23f,#2fd4ff);border-radius:4px;transition:width .25s}
#pct{font-variant-numeric:tabular-nums;opacity:.85}
#tip{max-width:80vw;text-align:center;font-weight:400;opacity:.7;min-height:1.4em;transition:opacity .3s}
#err{position:fixed;left:0;right:0;top:0;color:#fff;background:#c00;padding:10px;display:none;font:14px system-ui}
</style>
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="load">
  <div class="logo">VBM</div>
  <div class="grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="pct">準備中…</div>
  <div id="tip"></div>
</div>
<div id="err"></div>
<script>
// 方塊依序出現：每格錯開 0.12 秒
document.querySelectorAll('.grid i').forEach(function(e,i){e.style.animationDelay=(i*0.12)+'s'});
var tips=["第一次載入比較久，之後會快很多","太空站裡按 V 開關麥克風","農場一季結束前記得收成","躲貓貓：變成道具後別亂動","加到主畫面，玩起來像 App"];
var ti=Math.floor(Math.random()*tips.length),tipEl=document.getElementById('tip');
function nextTip(){tipEl.style.opacity=0;setTimeout(function(){tipEl.textContent=tips[ti++%tips.length];tipEl.style.opacity=.7},300)}
nextTip();var tipTimer=setInterval(nextTip,4000);
var canvas=document.getElementById("c");
var config={
  arguments:[],
  dataUrl:"Build/Web.data.unityweb",
  frameworkUrl:"Build/Web.framework.js.unityweb",
  codeUrl:"Build/Web.wasm.unityweb",
  streamingAssetsUrl:"StreamingAssets",
  companyName:"VBM Studio",
  productName:"Visual Block Map",
  productVersion:"0.1.10",
  autoSyncPersistentDataPath:true,
  showBanner:function(msg,type){if(type=='error'){var e=document.getElementById("err");e.textContent=msg;e.style.display='block';}}
};
if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) config.devicePixelRatio=Math.min(window.devicePixelRatio,2);
var pct=document.getElementById("pct"),fill=document.getElementById("fill");
var s=document.createElement("script");
s.src="Build/Web.loader.js";
s.onload=function(){
  createUnityInstance(canvas,config,function(p){
    fill.style.width=(100*p)+"%";
    pct.textContent=p<0.9?("下載中 "+Math.round(p/0.9*100)+"%"):"啟動中…";
  }).then(function(){clearInterval(tipTimer);document.getElementById("load").classList.add("done");canvas.focus();})
  .catch(function(m){alert(m);});
};
document.body.appendChild(s);
</script>
</body>
</html>
